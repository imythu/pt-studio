[package]
name = "pt-server"
description = "PT Studio server binary: kernel + compiled-in Native plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pt-server"
path = "src/main.rs"

[features]
default = ["identity", "torrent", "ledger", "accounting", "search", "llm-claude", "mcp", "ai-assistant", "rss", "tracker-bridge", "recommend"]
identity = ["dep:pt-plugin-identity"]
torrent = ["identity", "dep:pt-plugin-torrent"]
ledger = ["identity", "dep:pt-plugin-ledger"]
accounting = ["identity", "dep:pt-plugin-accounting"]
search = ["identity", "dep:pt-plugin-search-meilisearch"]
llm-claude = ["dep:pt-plugin-llm-claude"]
mcp = ["identity", "dep:pt-plugin-mcp"]
ai-assistant = ["dep:pt-plugin-ai-assistant"]
rss = ["identity", "torrent", "dep:pt-plugin-rss"]
tracker-bridge = ["identity", "torrent", "dep:pt-plugin-tracker-bridge"]
recommend = ["identity", "torrent", "accounting", "dep:pt-plugin-recommend"]

[dependencies]
pt-kernel.workspace = true
pt-plugin-api.workspace = true
pt-plugin-identity = { path = "../../plugins/native/identity", optional = true }
pt-plugin-torrent = { path = "../../plugins/native/torrent", optional = true }
pt-plugin-ledger = { path = "../../plugins/native/ledger", optional = true }
pt-plugin-accounting = { path = "../../plugins/native/accounting", optional = true }
pt-plugin-search-meilisearch = { path = "../../plugins/native/search-meilisearch", optional = true }
pt-plugin-llm-claude = { path = "../../plugins/native/llm-claude", optional = true }
pt-plugin-mcp = { path = "../../plugins/native/mcp", optional = true }
pt-plugin-ai-assistant = { path = "../../plugins/native/ai-assistant", optional = true }
pt-plugin-rss = { path = "../../plugins/native/rss", optional = true }
pt-plugin-tracker-bridge = { path = "../../plugins/native/tracker-bridge", optional = true }
pt-plugin-recommend = { path = "../../plugins/native/recommend", optional = true }
anyhow.workspace = true
axum.workspace = true
hex.workspace = true
sha2.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
chrono.workspace = true
sha1 = "0.10"
tracing-subscriber.workspace = true
async-trait.workspace = true
http.workspace = true
redis.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tower.workspace = true
uuid.workspace = true
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2.workspace = true

[lints]
workspace = true
