[package]
name = "pt-tracker"
description = "PT Studio tracker: HTTP announce/scrape with passkey admission, per-user traffic deltas to Redis Streams"
version = "0.1.0"
edition = "2024"
# D16：pt-tracker 单独以 AGPL-3.0-only 发布（将来复用 torrust 各包时无需改许可证）。只经 Redis 与站点通信，不链接站点代码。
license = "AGPL-3.0-only"
publish = false

# 独立工作区：主工作区（MIT OR Apache-2.0）不得依赖本 crate
[workspace]

[dependencies]
axum = "0.8"
hex = "0.4"
regex = "1"
redis = { version = "1", features = ["tokio-comp", "connection-manager", "streams"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
