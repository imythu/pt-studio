id = "identity"
name = "身份与权限"
version = "0.1.0"
kind = "native"
api = "pt:plugin@1"
license = "MIT OR Apache-2.0"
authors = ["PT Studio"]
description = "账号、会话、鉴权（ctx.auth）、权限（ctx.rbac）、用户资料（ctx.users）"

provides = ["ctx.auth@0.1.0", "ctx.rbac@0.1.0", "ctx.users@0.1.0"]
publishes = ["user.registered", "user.logged_in", "user.login_failed", "user.logged_out", "user.class_changed", "user.status_changed", "user.restriction_changed", "user.profile_updated", "user.password_changed", "user.passkey_reset", "user.challenge_issued", "user.verified", "user.two_factor_changed"]

[capabilities]
kv = true
sql = true
redis = true
# 登录限流、钩子输入中的 ip / email 需要（site.toml [grants.identity]）
sensitive_optional = ["user.ip", "user.email"]

[[hook_points]]
name = "user.before_register"
input_schema = "schemas/hooks/user.before_register.json"

[[hook_points]]
name = "user.before_login"
input_schema = "schemas/hooks/user.before_login.json"

[[http.routes]]
id = "login"
method = "POST"
path = "/v1/sessions"
auth = "public"
rate_limit = "ip:20/m"

[[http.routes]]
id = "logout"
method = "DELETE"
path = "/v1/sessions/current"
auth = "user"

[[http.routes]]
id = "register"
method = "POST"
path = "/v1/users"
auth = "public"
rate_limit = "ip:5/h"

[[http.routes]]
id = "get_me"
method = "GET"
path = "/v1/users/me"
auth = "user"
rate_limit = "user:120/m"

[[http.routes]]
id = "my_permissions"
method = "GET"
path = "/v1/users/me/permissions"
auth = "user"
rate_limit = "user:60/m"

[[http.routes]]
id = "list_tokens"
method = "GET"
path = "/v1/users/me/tokens"
auth = "user"
permission = "identity.tokens.manage_own"
rate_limit = "user:60/m"

[[http.routes]]
id = "create_token"
method = "POST"
path = "/v1/users/me/tokens"
auth = "user"
permission = "identity.tokens.manage_own"
rate_limit = "user:10/h"
idempotent = true

[[http.routes]]
id = "revoke_token"
method = "DELETE"
path = "/v1/users/me/tokens/{tid}"
auth = "user"
permission = "identity.tokens.manage_own"
rate_limit = "user:60/m"

[[http.routes]]
id = "get_passkey"
method = "GET"
path = "/v1/users/me/passkey"
auth = "user"
rate_limit = "user:30/m"

[[http.routes]]
id = "get_user"
method = "GET"
path = "/v1/users/{id}"
auth = "user"
rate_limit = "user:300/m"

[[http.routes]]
id = "admin_user_roles_grant"
method = "POST"
path = "/v1/admin/users/{id}/roles"
auth = "admin"
permission = "identity.roles.assign"
rate_limit = "user:60/h"

[[http.routes]]
id = "admin_list_restrictions"
method = "GET"
path = "/v1/admin/users/{id}/restrictions"
auth = "admin"
permission = "identity.users.read"

[[http.routes]]
id = "admin_apply_restriction"
method = "POST"
path = "/v1/admin/users/{id}/restrictions"
auth = "admin"
permission = "identity.users.ban"
rate_limit = "user:60/m"
idempotent = true

[[http.routes]]
id = "admin_lift_restriction"
method = "DELETE"
path = "/v1/admin/users/{id}/restrictions/{rid}"
auth = "admin"
permission = "identity.users.ban"
rate_limit = "user:60/m"

[[http.routes]]
id = "list_sessions"
method = "GET"
path = "/v1/sessions"
auth = "user"
rate_limit = "user:60/m"

[[http.routes]]
id = "revoke_session"
method = "DELETE"
path = "/v1/sessions/{sid}"
auth = "user"
rate_limit = "user:30/m"

[[http.routes]]
id = "revoke_other_sessions"
method = "POST"
path = "/v1/sessions/revocations"
auth = "user"
rate_limit = "user:10/m"
idempotent = true

[[http.routes]]
id = "get_profile"
method = "GET"
path = "/v1/users/me/profile"
auth = "user"
rate_limit = "user:120/m"

[[http.routes]]
id = "update_me"
method = "PATCH"
path = "/v1/users/me"
auth = "user"
permission = "identity.profile.update_own"
rate_limit = "user:30/m"

[[http.routes]]
id = "change_password"
method = "PUT"
path = "/v1/users/me/password"
auth = "user"
permission = "identity.profile.update_own"
rate_limit = "user:5/h"

[[http.routes]]
id = "reset_passkey"
method = "POST"
path = "/v1/users/me/passkey-resets"
auth = "user"
permission = "identity.passkey.reset_own"
rate_limit = "user:3/d"

[[http.routes]]
id = "admin_list_users"
method = "GET"
path = "/v1/admin/users"
auth = "admin"
permission = "identity.users.read"
rate_limit = "user:120/m"

[[http.routes]]
id = "admin_get_user"
method = "GET"
path = "/v1/admin/users/{id}"
auth = "admin"
permission = "identity.users.read"

[[http.routes]]
id = "admin_update_user"
method = "PATCH"
path = "/v1/admin/users/{id}"
auth = "admin"
permission = "identity.users.update"
rate_limit = "user:60/m"

[[http.routes]]
id = "admin_revoke_sessions"
method = "POST"
path = "/v1/admin/users/{id}/session-revocations"
auth = "admin"
permission = "identity.users.ban"
rate_limit = "user:30/h"
idempotent = true

[[http.routes]]
id = "admin_user_roles_revoke"
method = "DELETE"
path = "/v1/admin/users/{id}/roles/{role}"
auth = "admin"
permission = "identity.roles.assign"
rate_limit = "user:60/h"

[[http.routes]]
id = "my_security_events"
method = "GET"
path = "/v1/users/me/security-events"
auth = "user"
rate_limit = "user:60/m"

[[http.routes]]
id = "my_ip_history"
method = "GET"
path = "/v1/users/me/ip-history"
auth = "user"
rate_limit = "user:60/m"

[[http.routes]]
id = "admin_ip_history"
method = "GET"
path = "/v1/admin/users/{id}/ip-history"
auth = "admin"
permission = "identity.users.read_sensitive"
rate_limit = "user:120/h"

[[http.routes]]
id = "admin_shared_ips"
method = "GET"
path = "/v1/admin/users/{id}/shared-ips"
auth = "admin"
permission = "identity.users.read_sensitive"
rate_limit = "user:120/h"

[[http.routes]]
id = "admin_security_events"
method = "GET"
path = "/v1/admin/users/{id}/security-events"
auth = "admin"
permission = "identity.users.read"

[[http.routes]]
id = "admin_ip_lookup"
method = "GET"
path = "/v1/admin/ip-lookups"
auth = "admin"
permission = "identity.users.read_sensitive"
rate_limit = "user:60/h"

[[http.routes]]
id = "resend_verification"
method = "POST"
path = "/v1/email-verifications"
auth = "user"
rate_limit = "user:3/h"

[[http.routes]]
id = "confirm_verification"
method = "POST"
path = "/v1/email-verifications/confirm"
auth = "public"
rate_limit = "ip:30/m"

[[http.routes]]
id = "request_password_reset"
method = "POST"
path = "/v1/password-resets"
auth = "public"
rate_limit = "ip:5/h"

[[http.routes]]
id = "confirm_password_reset"
method = "POST"
path = "/v1/password-resets/confirm"
auth = "public"
rate_limit = "ip:10/h"

[[http.routes]]
id = "login_2fa"
method = "POST"
path = "/v1/sessions/two-factor"
auth = "public"
rate_limit = "ip:30/m"

[[http.routes]]
id = "reauth"
method = "POST"
path = "/v1/sessions/current/reauth"
auth = "user"
rate_limit = "user:10/m"

[[http.routes]]
id = "two_factor_status"
method = "GET"
path = "/v1/users/me/two-factor"
auth = "user"
rate_limit = "user:60/m"

[[http.routes]]
id = "totp_begin"
method = "POST"
path = "/v1/users/me/totp"
auth = "user"
reauth_secs = 600
rate_limit = "user:10/h"

[[http.routes]]
id = "totp_confirm"
method = "POST"
path = "/v1/users/me/totp/confirm"
auth = "user"
reauth_secs = 600
rate_limit = "user:20/h"

[[http.routes]]
id = "totp_disable"
method = "DELETE"
path = "/v1/users/me/totp"
auth = "user"
reauth_secs = 600
rate_limit = "user:10/h"

[[http.routes]]
id = "recovery_regenerate"
method = "POST"
path = "/v1/users/me/recovery-codes"
auth = "user"
reauth_secs = 600
rate_limit = "user:10/h"

[[cron]]
name = "ip_retention"
schedule = "17 3 * * *"
timeout_secs = 600
tx = "manual"

[[cron]]
name = "restriction_sweep"
schedule = "* * * * *"
timeout_secs = 55
tx = "manual"

[[permissions]]
name = "identity.profile.update_own"
description_term = "identity.perm.profile_update_own"
default_roles = ["user"]

[[permissions]]
name = "identity.passkey.reset_own"
description_term = "identity.perm.passkey_reset_own"
default_roles = ["user"]

[[permissions]]
name = "identity.tokens.manage_own"
description_term = "identity.perm.tokens_manage_own"
default_roles = ["user"]

[[permissions]]
name = "identity.users.read"
description_term = "identity.perm.users_read"
default_roles = ["moderator"]

[[permissions]]
name = "identity.users.update"
description_term = "identity.perm.users_update"
default_roles = ["admin"]

[[permissions]]
name = "identity.users.ban"
description_term = "identity.perm.users_ban"
default_roles = ["moderator"]

[[permissions]]
name = "identity.users.read_sensitive"
description_term = "identity.perm.users_read_sensitive"
default_roles = ["admin"]

[[permissions]]
name = "identity.roles.assign"
description_term = "identity.perm.roles_assign"
default_roles = ["admin"]

[[permissions]]
name = "identity.roles.manage"
description_term = "identity.perm.roles_manage"
default_roles = []

[[mcp.tools]]
name = "get_my_profile"
title = "我的资料"
description = "查询当前用户的资料：用户名、等级、状态、角色、注册时间。用户问“我是什么等级 / 我的账号状态”时使用。"
input_schema = { type = "object", additionalProperties = false, properties = {} }
output_schema = { type = "object", required = ["id", "username", "status"], properties = { id = { type = "integer" }, username = { type = "string" }, status = { type = "string" }, class_id = { type = "integer" }, roles = { type = "array", items = { type = "string" } }, created_at = { type = "integer" } } }

[[mcp.tools]]
name = "admin_set_user_status"
title = "限制用户"
description = "管理员：封禁用户或禁止其下载。需要说明原因代码；只能处理等级低于自己的用户。"
audience = "admin"
write = true
confirm_locked = true
destructive = true
permission = "identity.users.ban"
input_schema = { type = "object", additionalProperties = false, required = ["user_id", "status", "reason_code"], properties = { user_id = { type = "integer", minimum = 1 }, status = { type = "string", enum = ["banned", "leech_disabled"] }, reason_code = { type = "string", maxLength = 64 }, note = { type = "string", maxLength = 500 }, until = { type = "integer" } } }

[database]
migrations = "migrations"
views = ["v_user_public"]

[settings_schema]
type = "object"
x-pt-order = ["require_email_verification", "two_factor_required_role", "login_user_lock_after", "login_user_window_secs", "login_ip_block_after", "login_ip_window_secs", "login_max_delay_secs", "login_alert", "ip_truncate_after_days", "ip_delete_after_days", "ip_show_full_to_owner"]

[settings_schema.properties.require_email_verification]
type = "boolean"
default = false
title = "注册后必须验证邮箱（验证前只有访客权限；需先配置 notify 的邮件渠道）"

[settings_schema.properties.two_factor_required_role]
type = "string"
enum = ["", "uploader", "moderator", "admin", "sysop"]
default = ""
title = "该角色及以上必须开启两步验证（未通过两步验证的会话不享有这些角色的权限；空 = 不强制）"

[settings_schema.properties.login_user_lock_after]
type = "integer"
minimum = 3
maximum = 100
default = 10
title = "同一账号连续登录失败多少次后临时锁定（已登录过的设备不受影响）"

[settings_schema.properties.login_user_window_secs]
type = "integer"
minimum = 60
maximum = 86400
default = 900
title = "账号失败计数与锁定时长（秒）"

[settings_schema.properties.login_ip_block_after]
type = "integer"
minimum = 5
maximum = 10000
default = 50
title = "同一 IP 登录失败多少次后封锁该 IP 的登录"

[settings_schema.properties.login_ip_window_secs]
type = "integer"
minimum = 60
maximum = 86400
default = 3600
title = "IP 失败计数与封锁时长（秒）"

[settings_schema.properties.login_max_delay_secs]
type = "integer"
minimum = 0
maximum = 300
default = 30
title = "连续失败的最长等待（秒，第 3 次失败起按 1、2、4… 秒递增）"

[settings_schema.properties.login_alert]
type = "boolean"
default = true
title = "新设备登录时发送安全通知"

[settings_schema.properties.ip_truncate_after_days]
type = "integer"
minimum = 1
maximum = 3650
default = 90
title = "IP 记录多少天后截断为 /24（IPv6 /48）"

[settings_schema.properties.ip_delete_after_days]
type = "integer"
minimum = 1
maximum = 3650
default = 365
title = "IP 记录与安全事件保留天数"

[settings_schema.properties.ip_show_full_to_owner]
type = "boolean"
default = false
title = "用户在自己的安全页可以看到完整 IP（否则只显示网段）"

[terms]
"identity.role.guest" = { zh-CN = "访客", en = "Guest" }
"identity.role.user" = { zh-CN = "用户", en = "User" }
"identity.role.uploader" = { zh-CN = "发布员", en = "Uploader" }
"identity.role.moderator" = { zh-CN = "版主", en = "Moderator" }
"identity.role.admin" = { zh-CN = "管理员", en = "Administrator" }
"identity.role.sysop" = { zh-CN = "站务", en = "Sysop" }
