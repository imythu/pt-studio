id = "identity"
name = "身份与权限"
version = "0.1.0"
kind = "native"
api = "pt:plugin@1"
license = "MIT OR Apache-2.0"
authors = ["PT Studio"]
description = "账号、会话、鉴权（ctx.auth）、权限（ctx.rbac）、用户资料（ctx.users）"

provides = ["ctx.auth@0.1.0", "ctx.rbac@0.1.0", "ctx.users@0.1.0"]
publishes = ["user.registered", "user.logged_in", "user.login_failed", "user.logged_out", "user.class_changed", "user.status_changed", "user.restriction_changed", "user.profile_updated", "user.password_changed", "user.passkey_reset"]

[capabilities]
kv = true
sql = true
redis = true
# 登录限流、钩子输入中的 ip / email 需要（site.toml [grants.identity]）
sensitive_optional = ["user.ip", "user.email"]

[[hook_points]]
name = "user.before_register"
input_schema = "schemas/hooks/user.before_register.json"

[[hook_points]]
name = "user.before_login"
input_schema = "schemas/hooks/user.before_login.json"

[[http.routes]]
id = "login"
method = "POST"
path = "/v1/sessions"
auth = "public"
rate_limit = "ip:20/m"

[[http.routes]]
id = "logout"
method = "DELETE"
path = "/v1/sessions/current"
auth = "user"

[[http.routes]]
id = "register"
method = "POST"
path = "/v1/users"
auth = "public"
rate_limit = "ip:5/h"

[[http.routes]]
id = "get_me"
method = "GET"
path = "/v1/users/me"
auth = "user"
rate_limit = "user:120/m"

[[http.routes]]
id = "my_permissions"
method = "GET"
path = "/v1/users/me/permissions"
auth = "user"
rate_limit = "user:60/m"

[[http.routes]]
id = "list_tokens"
method = "GET"
path = "/v1/users/me/tokens"
auth = "user"
permission = "identity.tokens.manage_own"
rate_limit = "user:60/m"

[[http.routes]]
id = "create_token"
method = "POST"
path = "/v1/users/me/tokens"
auth = "user"
permission = "identity.tokens.manage_own"
rate_limit = "user:10/h"
idempotent = true

[[http.routes]]
id = "revoke_token"
method = "DELETE"
path = "/v1/users/me/tokens/{tid}"
auth = "user"
permission = "identity.tokens.manage_own"
rate_limit = "user:60/m"

[[http.routes]]
id = "get_passkey"
method = "GET"
path = "/v1/users/me/passkey"
auth = "user"
rate_limit = "user:30/m"

[[http.routes]]
id = "get_user"
method = "GET"
path = "/v1/users/{id}"
auth = "user"
rate_limit = "user:300/m"

[[http.routes]]
id = "admin_user_roles_grant"
method = "POST"
path = "/v1/admin/users/{id}/roles"
auth = "admin"
permission = "identity.roles.assign"
rate_limit = "user:60/h"

[[http.routes]]
id = "admin_list_restrictions"
method = "GET"
path = "/v1/admin/users/{id}/restrictions"
auth = "admin"
permission = "identity.users.read"

[[http.routes]]
id = "admin_apply_restriction"
method = "POST"
path = "/v1/admin/users/{id}/restrictions"
auth = "admin"
permission = "identity.users.ban"
rate_limit = "user:60/m"
idempotent = true

[[http.routes]]
id = "admin_lift_restriction"
method = "DELETE"
path = "/v1/admin/users/{id}/restrictions/{rid}"
auth = "admin"
permission = "identity.users.ban"
rate_limit = "user:60/m"

[[http.routes]]
id = "list_sessions"
method = "GET"
path = "/v1/sessions"
auth = "user"
rate_limit = "user:60/m"

[[http.routes]]
id = "revoke_session"
method = "DELETE"
path = "/v1/sessions/{sid}"
auth = "user"
rate_limit = "user:30/m"

[[http.routes]]
id = "revoke_other_sessions"
method = "POST"
path = "/v1/sessions/revocations"
auth = "user"
rate_limit = "user:10/m"
idempotent = true

[[http.routes]]
id = "get_profile"
method = "GET"
path = "/v1/users/me/profile"
auth = "user"
rate_limit = "user:120/m"

[[http.routes]]
id = "update_me"
method = "PATCH"
path = "/v1/users/me"
auth = "user"
permission = "identity.profile.update_own"
rate_limit = "user:30/m"

[[http.routes]]
id = "change_password"
method = "PUT"
path = "/v1/users/me/password"
auth = "user"
permission = "identity.profile.update_own"
rate_limit = "user:5/h"

[[http.routes]]
id = "reset_passkey"
method = "POST"
path = "/v1/users/me/passkey-resets"
auth = "user"
permission = "identity.passkey.reset_own"
rate_limit = "user:3/d"

[[http.routes]]
id = "admin_list_users"
method = "GET"
path = "/v1/admin/users"
auth = "admin"
permission = "identity.users.read"
rate_limit = "user:120/m"

[[http.routes]]
id = "admin_get_user"
method = "GET"
path = "/v1/admin/users/{id}"
auth = "admin"
permission = "identity.users.read"

[[http.routes]]
id = "admin_update_user"
method = "PATCH"
path = "/v1/admin/users/{id}"
auth = "admin"
permission = "identity.users.update"
rate_limit = "user:60/m"

[[http.routes]]
id = "admin_revoke_sessions"
method = "POST"
path = "/v1/admin/users/{id}/session-revocations"
auth = "admin"
permission = "identity.users.ban"
rate_limit = "user:30/h"
idempotent = true

[[http.routes]]
id = "admin_user_roles_revoke"
method = "DELETE"
path = "/v1/admin/users/{id}/roles/{role}"
auth = "admin"
permission = "identity.roles.assign"
rate_limit = "user:60/h"

[[cron]]
name = "restriction_sweep"
schedule = "* * * * *"
timeout_secs = 55
tx = "manual"

[[permissions]]
name = "identity.profile.update_own"
description_term = "identity.perm.profile_update_own"
default_roles = ["user"]

[[permissions]]
name = "identity.passkey.reset_own"
description_term = "identity.perm.passkey_reset_own"
default_roles = ["user"]

[[permissions]]
name = "identity.tokens.manage_own"
description_term = "identity.perm.tokens_manage_own"
default_roles = ["user"]

[[permissions]]
name = "identity.users.read"
description_term = "identity.perm.users_read"
default_roles = ["moderator"]

[[permissions]]
name = "identity.users.update"
description_term = "identity.perm.users_update"
default_roles = ["admin"]

[[permissions]]
name = "identity.users.ban"
description_term = "identity.perm.users_ban"
default_roles = ["moderator"]

[[permissions]]
name = "identity.users.read_sensitive"
description_term = "identity.perm.users_read_sensitive"
default_roles = ["admin"]

[[permissions]]
name = "identity.roles.assign"
description_term = "identity.perm.roles_assign"
default_roles = ["admin"]

[[permissions]]
name = "identity.roles.manage"
description_term = "identity.perm.roles_manage"
default_roles = []

[[mcp.tools]]
name = "get_my_profile"
title = "我的资料"
description = "查询当前用户的资料：用户名、等级、状态、角色、注册时间。用户问“我是什么等级 / 我的账号状态”时使用。"
input_schema = { type = "object", additionalProperties = false, properties = {} }
output_schema = { type = "object", required = ["id", "username", "status"], properties = { id = { type = "integer" }, username = { type = "string" }, status = { type = "string" }, class_id = { type = "integer" }, roles = { type = "array", items = { type = "string" } }, created_at = { type = "integer" } } }

[[mcp.tools]]
name = "admin_set_user_status"
title = "限制用户"
description = "管理员：封禁用户或禁止其下载。需要说明原因代码；只能处理等级低于自己的用户。"
audience = "admin"
write = true
confirm_locked = true
destructive = true
permission = "identity.users.ban"
input_schema = { type = "object", additionalProperties = false, required = ["user_id", "status", "reason_code"], properties = { user_id = { type = "integer", minimum = 1 }, status = { type = "string", enum = ["banned", "leech_disabled"] }, reason_code = { type = "string", maxLength = 64 }, note = { type = "string", maxLength = 500 }, until = { type = "integer" } } }

[database]
migrations = "migrations"
views = ["v_user_public"]

[terms]
"identity.role.guest" = { zh-CN = "访客", en = "Guest" }
"identity.role.user" = { zh-CN = "用户", en = "User" }
"identity.role.uploader" = { zh-CN = "发布员", en = "Uploader" }
"identity.role.moderator" = { zh-CN = "版主", en = "Moderator" }
"identity.role.admin" = { zh-CN = "管理员", en = "Administrator" }
"identity.role.sysop" = { zh-CN = "站务", en = "Sysop" }
