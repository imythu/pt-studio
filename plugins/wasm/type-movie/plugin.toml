id = "type-movie"
name = "资源类型：电影"
version = "0.1.0"
kind = "wasm"
api = "pt:plugin@1"
license = "MIT OR Apache-2.0"
authors = ["PT Studio"]
description = "电影：字段 schema、从发布名补全规格、按 IMDb / TMDB / 豆瓣分组、规范标题、搜索字段"

requires = ["ctx.torrents@^0.1"]
optional_requires = ["ctx.metadata@^0.1"]

[capabilities]
sql = true
content_type = true
search_contributor = true
views = ["torrent.v_torrent_fields"]

[capabilities.scopes]
"ctx.torrents" = ["write:group"]

[[subscriptions]]
name = "on_group_created"
event = "group.created"

# 已有 Group 但还没补全元数据时（如首次上传未填 ID），新种子进入该 Group 也触发一次补全
[[subscriptions]]
name = "on_torrent_created"
event = "torrent.created"

[[jobs]]
name = "fetch_metadata"
timeout_secs = 60

[settings_schema]
type = "object"

[settings_schema.properties.title_template]
type = "string"
maxLength = 300
title = "规范标题模板"
default = "{title} {year} {edition?| }{resolution} {release_type?| }{source} {hdr?| }{video_codec} {audio_codecs?| }-{release_group}"

[settings_schema.properties.metadata_locale]
type = "string"
maxLength = 16
title = "元数据语言"
default = "zh-CN"

[terms]
"type-movie.name" = { zh-CN = "电影", en = "Movies" }
"type-movie.field.title" = { zh-CN = "片名", en = "Title" }
"type-movie.field.original_title" = { zh-CN = "原名", en = "Original title" }
"type-movie.field.year" = { zh-CN = "年份", en = "Year" }
"type-movie.field.imdb_id" = { zh-CN = "IMDb", en = "IMDb" }
"type-movie.field.tmdb_id" = { zh-CN = "TMDB", en = "TMDB" }
"type-movie.field.douban_id" = { zh-CN = "豆瓣", en = "Douban" }
"type-movie.field.resolution" = { zh-CN = "分辨率", en = "Resolution" }
"type-movie.field.source" = { zh-CN = "片源", en = "Source" }
"type-movie.field.release_type" = { zh-CN = "发布类型", en = "Release type" }
"type-movie.field.video_codec" = { zh-CN = "视频编码", en = "Video codec" }
"type-movie.field.audio_codecs" = { zh-CN = "音频编码", en = "Audio codecs" }
"type-movie.field.hdr" = { zh-CN = "HDR", en = "HDR" }
"type-movie.field.release_group" = { zh-CN = "制作组", en = "Release group" }
"type-movie.field.edition" = { zh-CN = "版本", en = "Edition" }
"type-movie.field.release_name" = { zh-CN = "发布名", en = "Release name" }
"type-movie.field.release_name.hint" = { zh-CN = "场景发布名；未填写的规格会从中自动补全", en = "Scene release name; missing specs are filled from it" }
"type-movie.field.poster" = { zh-CN = "海报", en = "Poster" }
"type-movie.field.overview" = { zh-CN = "简介", en = "Overview" }
"type-movie.field.genres" = { zh-CN = "类型", en = "Genres" }
"type-movie.field.runtime_min" = { zh-CN = "片长（分钟）", en = "Runtime (min)" }
"type-movie.field.rating" = { zh-CN = "TMDB 评分", en = "TMDB rating" }
"type-movie.field.countries" = { zh-CN = "国家 / 地区", en = "Countries" }
"type-movie.field.is_3d" = { zh-CN = "3D", en = "3D" }
