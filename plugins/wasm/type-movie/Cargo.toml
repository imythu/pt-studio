[package]
name = "pt-wasm-type-movie"
description = "PT Studio movie content type (WASM): field schema, normalization from release names, grouping by external ids"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.62"
pt-release-parser = { path = "../../../crates/release-parser" }
pt-type-kit = { path = "../../../crates/type-kit" }
