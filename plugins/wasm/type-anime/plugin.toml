id = "type-anime"
name = "资源类型：动漫"
version = "0.1.0"
kind = "wasm"
api = "pt:plugin@1"
license = "MIT OR Apache-2.0"
authors = ["PT Studio"]
description = "动漫：解析字幕组风格发布名（字幕组、集号、字幕语言与方式）、字幕组别名、按 Bangumi / AniDB / TMDB 分组、范围检查、搜索字段"

requires = ["ctx.torrents@^0.1"]
optional_requires = ["ctx.metadata@^0.1"]

[capabilities]
sql = true
content_type = true
search_contributor = true
views = ["torrent.v_torrent_fields"]

[capabilities.scopes]
"ctx.torrents" = ["write:group"]

[[hooks]]
hook = "torrent.before_upload"
priority = 21

[[subscriptions]]
name = "on_group_created"
event = "group.created"

# 已有 Group 但还没补全元数据时（如首次上传未填 ID），新种子进入该 Group 也触发一次补全
[[subscriptions]]
name = "on_torrent_created"
event = "torrent.created"

[[jobs]]
name = "fetch_metadata"
timeout_secs = 60

[settings_schema]
type = "object"

[settings_schema.properties.title_template]
type = "string"
maxLength = 300
title = "规范标题模板"
default = "{fansub?[|] }{title} {se} {resolution?[|]}{source?[|]}{video_codec?[|]}{bit_depth?[|bit]}{subtitle_langs?[|]}"

[settings_schema.properties.metadata_locale]
type = "string"
maxLength = 16
title = "元数据语言"
default = "zh-CN"

[settings_schema.properties.scope_check]
type = "boolean"
title = "上传时按文件列表检查范围"
default = true

[settings_schema.properties.season_pack_min_ratio]
type = "number"
minimum = 0
maximum = 1
title = "季包最少集数比例（完结季）"
default = 0.8

[settings_schema.properties.fansub_aliases]
type = "object"
title = "字幕组别名（别名 → 规范名）"
additionalProperties = { type = "string", maxLength = 60 }
default = {}

