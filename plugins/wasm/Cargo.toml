# WASM 插件工作区（目标 wasm32-wasip2）：cargo build --release --target wasm32-wasip2
[workspace]
resolver = "3"
members = ["ai-upload-review", "bonus", "hnr", "invite", "levels", "metadata-tmdb", "promotion", "type-anime", "type-generic", "type-movie", "type-music", "type-tv", "x-chaos"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = "s"
lto = true
strip = true
