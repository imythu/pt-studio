# WASM 插件工作区（目标 wasm32-wasip2）：cargo build --release --target wasm32-wasip2
[workspace]
resolver = "3"
members = ["ai-moderation", "ai-upload-review", "anticheat", "bonus", "bookmarks", "captcha", "claims", "checkin", "comments", "forum", "hnr", "invite", "levels", "mediainfo", "messages", "metadata-douban", "metadata-tmdb", "moderation", "newbie-exam", "notify", "promotion", "ratio-policy", "registration-policy", "reports", "requests", "seedbox", "top10", "type-anime", "type-generic", "type-movie", "type-music", "type-tv", "x-chaos"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = "s"
lto = true
strip = true
