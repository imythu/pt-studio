# WASM 插件工作区（目标 wasm32-wasip2）：cargo build --release --target wasm32-wasip2
[workspace]
resolver = "3"
members = ["bonus", "invite", "levels", "promotion", "x-chaos"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = "s"
lto = true
strip = true
