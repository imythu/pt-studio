id = "lottery"
name = "抽奖"
version = "0.2.0"
kind = "wasm"
api = "pt:plugin@1"
license = "MIT OR Apache-2.0"
authors = ["PT Studio"]
description = "幸运转盘：用户消耗魔力值转动转盘，奖品可为魔力值、上传量、VIP 天数或永久 VIP；奖品、中奖概率与库存在后台设置，开关、每次消耗、每日次数与注册天数门槛在插件设置里。默认关闭"
summary = "幸运转盘：花魔力值抽奖，奖品可设魔力值、上传量、VIP 等"
category = "play"

provides = ["ctx.lottery@0.2.0"]
requires = ["ctx.ledger@^0.1"]
optional_requires = ["ctx.accounting@^0.1", "ctx.levels@^0.1"]
publishes = ["lottery.spun"]

[capabilities]
sql = true
views = ["identity.v_user_public"]

[capabilities.scopes]
"ctx.ledger" = ["currency:bonus"]
"ctx.accounting" = ["write:adjust"]
"ctx.levels" = ["grant"]

[[http.routes]]
id = "wheel"
method = "GET"
path = "/v1/wheel"
auth = "user"

[[http.routes]]
id = "spin"
method = "POST"
path = "/v1/wheel/spin"
auth = "user"
permission = "lottery.use"
rate_limit = "user:30/m"

[[http.routes]]
id = "me"
method = "GET"
path = "/v1/me"
auth = "user"

[[http.routes]]
id = "admin_wheel"
method = "GET"
path = "/v1/admin/wheel"
auth = "admin"
permission = "lottery.manage"

[[http.routes]]
id = "admin_prizes"
method = "PUT"
path = "/v1/admin/wheel/prizes"
auth = "admin"
permission = "lottery.manage"

[[permissions]]
name = "lottery.use"
description_term = "lottery.perm.use"
default_roles = ["user"]

[[permissions]]
name = "lottery.manage"
description_term = "lottery.perm.manage"
default_roles = ["admin"]

[error_codes]
"lottery.disabled" = 403
"lottery.not_eligible" = 403
"lottery.limit_reached" = 409
"lottery.insufficient_funds" = 402
"lottery.grant_failed" = 503
"lottery.unavailable" = 503

[database]
migrations = "migrations"

[frontend]
entry = "index.js"
slots = ["nav.main", "home.widgets", "bonus.explain"]
routes = ["/p/lottery/*", "/admin/p/lottery/*"]
settings_ui = "schema"

[settings_schema]
type = "object"
x-pt-order = ["enabled", "spin_cost", "daily_limit", "min_account_days"]

[settings_schema.properties.enabled]
type = "boolean"
default = true
title = "开启幸运转盘（请确认符合当地法规与站点规则）"

[settings_schema.properties.spin_cost]
type = "integer"
minimum = 0
maximum = 1000000
default = 50
title = "每次抽奖消耗的魔力值（0 为免费）"

[settings_schema.properties.daily_limit]
type = "integer"
minimum = 0
maximum = 1000
default = 10
title = "每人每天最多抽几次（0 为不限）"

[settings_schema.properties.min_account_days]
type = "integer"
minimum = 0
maximum = 365
default = 7
title = "注册满多少天才能抽奖"

[terms]
"lottery.name" = { zh-CN = "抽奖", en = "Lottery" }
"lottery.perm.use" = { zh-CN = "转动幸运转盘", en = "Spin the prize wheel" }
"lottery.perm.manage" = { zh-CN = "管理抽奖", en = "Manage the lottery" }
