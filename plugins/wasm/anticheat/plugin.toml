[database]
migrations = "migrations"

[[database.partitions]]
table = "evidence"
by = "range_month"
premake = 2

[frontend]
entry = "index.js"
slots = ["admin.dashboard.widgets", "admin.user.tabs", "nav.user_menu"]
routes = ["/p/anticheat/*", "/admin/p/anticheat/*"]
settings_ui = "schema"

[settings_schema]
type = "object"
additionalProperties = true
x-pt-order = ["auto_actions_enabled", "auto_ban_enabled", "four_eyes_for_ban", "four_eyes_for_appeal", "protected_min_role", "breaker_max_auto_per_hour", "breaker_tripped", "freeze_default_days", "freeze_down_permille", "warn_default_days", "claim_ttl_secs", "review_sla_hours", "appeal_window_days", "appeal_max_per_case", "appeal_token_ttl_days", "appeal_suspend_sanctions", "spike_min_bytes", "spike_factor", "enrich_top_torrents", "hooks_block_operations", "hooks_block_checkin_when_frozen", "require_simulation_before_activate", "stats_min_precision", "retention_case_months", "user_view_show_torrents", "llm_profile"]

[settings_schema.properties.auto_actions_enabled]
type = "boolean"
default = true
title = "允许自动处置（仅结论性规则）"

[settings_schema.properties.auto_ban_enabled]
type = "boolean"
default = false
title = "允许策略自动封禁 / 禁止下载"

[settings_schema.properties.four_eyes_for_ban]
type = "boolean"
default = true
title = "封禁需另一名管理员批准"

[settings_schema.properties.four_eyes_for_appeal]
type = "boolean"
default = true
title = "申诉须由原决定人以外的人复核"

[settings_schema.properties.protected_min_role]
type = "string"
enum = ["uploader", "moderator", "admin", "sysop"]
default = "moderator"
title = "受保护（不自动处置）的最低角色"

[settings_schema.properties.breaker_max_auto_per_hour]
type = "integer"
minimum = 1
maximum = 10000
default = 50
title = "熔断：每小时自动处置上限"

[settings_schema.properties.breaker_tripped]
type = "boolean"
default = false
title = "手动熔断（停止全部自动处置）"

[settings_schema.properties.freeze_default_days]
type = "integer"
minimum = 1
maximum = 365
default = 7
title = "冻结流量默认天数"

[settings_schema.properties.freeze_down_permille]
type = "integer"
minimum = 0
maximum = 10000
title = "冻结期下载计入千分比（留空 = 不覆盖）"

[settings_schema.properties.warn_default_days]
type = "integer"
minimum = 1
maximum = 365
default = 14
title = "警告默认天数"

[settings_schema.properties.claim_ttl_secs]
type = "integer"
minimum = 300
maximum = 14400
default = 1800
title = "认领有效期（秒）"

[settings_schema.properties.review_sla_hours]
type = "integer"
minimum = 1
maximum = 720
default = 72
title = "复核时限（小时）"

[settings_schema.properties.appeal_window_days]
type = "integer"
minimum = 1
maximum = 90
default = 14
title = "申诉期限（天）"

[settings_schema.properties.appeal_max_per_case]
type = "integer"
minimum = 1
maximum = 5
default = 1
title = "每案件申诉次数"

[settings_schema.properties.appeal_token_ttl_days]
type = "integer"
minimum = 1
maximum = 90
default = 30
title = "封禁申诉链接有效期（天）"

[settings_schema.properties.appeal_suspend_sanctions]
type = "boolean"
default = false
title = "申诉期间暂停处置（封禁除外）"

[settings_schema.properties.spike_min_bytes]
type = "integer"
minimum = 1073741824
default = 536870912000
title = "每日上传跳变：最低字节数"

[settings_schema.properties.spike_factor]
type = "integer"
minimum = 2
maximum = 100
default = 5
title = "每日上传跳变：相对 P95 的倍数"

[settings_schema.properties.enrich_top_torrents]
type = "integer"
minimum = 0
maximum = 20
default = 5
title = "开案时保存 swarm 快照的种子数"

[settings_schema.properties.hooks_block_operations]
type = "array"
items = { type = "string", enum = ["transfer", "burn", "hold"] }
default = ["transfer"]
title = "调查期间禁止的钱包操作"

[settings_schema.properties.hooks_block_checkin_when_frozen]
type = "boolean"
default = false
title = "冻结期禁止签到"

[settings_schema.properties.require_simulation_before_activate]
type = "boolean"
default = true
title = "激活规则集前必须先回测"

[settings_schema.properties.stats_min_precision]
type = "integer"
minimum = 0
maximum = 100
default = 70
title = "规则准确率告警阈值（%）"

[settings_schema.properties.retention_case_months]
type = "integer"
minimum = 12
maximum = 120
default = 36
title = "已结案件保留（月）"

[settings_schema.properties.user_view_show_torrents]
type = "boolean"
default = true
title = "用户的案件页显示涉及的种子"

[settings_schema.properties.llm_profile]
type = "string"
default = "default"
title = "AI 解释使用的模型 profile"

