id = "bonus"
name = "魔力值"
version = "0.1.0"
kind = "wasm"
api = "pt:plugin@1"
license = "MIT OR Apache-2.0"
authors = ["PT Studio"]
description = "站点魔力值：币种初始化、行为奖励、ctx.bonus.award（P3 试点子集）"

provides = ["ctx.bonus@0.1.0"]
requires = ["ctx.ledger@^0.1", "ctx.users@^0.1"]
publishes = ["bonus.awarded", "bonus.hourly_settled"]

[capabilities]
kv = true
sql = true
# snatch_seed_secs 变量
views = ["accounting.v_snatch"]

[capabilities.scopes]
"ctx.ledger" = ["currency:bonus", "currency:seed_points", "read"]

[[subscriptions]]
name = "on_seeding_snapshot"
event = "traffic.seeding_snapshot_taken"
ordered = true

[[cron]]
name = "post_accruals"
schedule = "40 * * * *"
timeout_secs = 3000
catch_up = "once"
tx = "manual"

[[subscriptions]]
name = "on_torrent_created"
event = "torrent.created"

[[mcp.tools]]
name = "get_my_bonus"
title = "我的魔力值"
description = "查询当前用户各币种（魔力值等）的余额与可用余额。"
input_schema = { type = "object", additionalProperties = false, properties = {} }

[[http.routes]]
id = "my_summary"
method = "GET"
path = "/v1/users/me/summary"
auth = "user"
rate_limit = "user:60/m"

[database]
migrations = "migrations"

[[database.partitions]]
table = "user_hours"
by = "range_month"
premake = 3

[wasm]
memory_mb = 64
max_concurrency = 32
default_timeout_ms = 2000

[frontend]
entry = "index.js"
slots = ["user.profile.stats", "nav.user_menu"]
routes = ["/p/bonus/*"]
settings_ui = "schema"

[terms]
"bonus.currency" = { zh-CN = "魔力值", en = "Bonus Points" }
"bonus.seed_points" = { zh-CN = "做种积分", en = "Seeding Points" }
