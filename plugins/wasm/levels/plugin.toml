id = "levels"
name = "等级"
version = "0.1.0"
kind = "wasm"
api = "pt:plugin@1"
license = "MIT OR Apache-2.0"
authors = ["PT Studio"]
description = "用户等级：按流量、分享率、注册时长、发布数自动升降级（警告期、升级保护、覆盖层），等级绑定角色决定权限"
summary = "根据流量、分享率和注册时长自动升降用户等级"
category = "users"

provides = ["ctx.levels@0.1.0"]
requires = ["ctx.users@^0.1", "ctx.rbac@^0.1"]
publishes = ["level.promoted", "level.demoted", "level.warned", "level.warning_cleared"]

[capabilities]
sql = true
views = ["identity.v_user_public", "accounting.v_user_totals", "torrent.v_uploader_counts", "ledger.v_balance"]

[capabilities.scopes]
"ctx.users" = ["write:class"]
"ctx.rbac" = ["write:roles", "write:class"]

[[subscriptions]]
name = "on_registered"
event = "user.registered"

[[subscriptions]]
name = "on_traffic_settled"
event = "traffic.settled"

[[subscriptions]]
name = "on_logged_in"
event = "user.logged_in"

[[hooks]]
hook = "invite.before_issue"
priority = 20

[[cron]]
name = "incr_evaluate"
schedule = "*/15 * * * *"
timeout_secs = 600
tx = "manual"

[[cron]]
name = "daily_evaluate"
schedule = "0 4 * * *"
timeout_secs = 1800
tx = "manual"

[[mcp.tools]]
name = "get_my_level"
title = "我的等级"
description = "查询当前用户的等级与升级进度（下一等级的条件与当前数值）。"
input_schema = { type = "object", additionalProperties = false, properties = {} }

[[http.routes]]
id = "me"
method = "GET"
path = "/v1/me"
auth = "user"
rate_limit = "user:60/m"

[[http.routes]]
id = "classes"
method = "GET"
path = "/v1/classes"
auth = "user"
rate_limit = "user:60/m"

[[http.routes]]
id = "admin_classes"
method = "GET"
path = "/v1/admin/classes"
auth = "admin"
permission = "levels.manage"
rate_limit = "user:60/m"

[[http.routes]]
id = "admin_user"
method = "GET"
path = "/v1/admin/users/{user_id}"
auth = "admin"
permission = "levels.manage"
rate_limit = "user:60/m"

[[http.routes]]
id = "set_user_class"
method = "POST"
path = "/v1/admin/users/{user_id}/class"
auth = "admin"
permission = "levels.manage"
rate_limit = "user:60/m"

[[http.routes]]
id = "unlock_user_class"
method = "DELETE"
path = "/v1/admin/users/{user_id}/class"
auth = "admin"
permission = "levels.manage"
rate_limit = "user:60/m"

[[http.routes]]
id = "protect_user"
method = "POST"
path = "/v1/admin/users/{user_id}/protect"
auth = "admin"
permission = "levels.protect"
rate_limit = "user:60/m"

[[permissions]]
name = "levels.manage"
description_term = "levels.perm.manage"
default_roles = ["admin"]

[[permissions]]
name = "levels.protect"
description_term = "levels.perm.protect"
default_roles = ["admin"]

[database]
migrations = "migrations"

[[database.partitions]]
table = "history"
by = "range_month"
premake = 3

[frontend]
entry = "index.js"
slots = ["user.profile.stats", "nav.user_menu", "admin.user.tabs"]
routes = ["/p/levels/*", "/admin/p/levels/*"]
settings_ui = "schema"

# 运行时设置（后台“插件设置”）。等级列表的顺序即等级高低（从低到高）；key 是等级的唯一标识
# （NexusPHP 英文名小写、空格换成下划线），name / description 留空时使用内置的多语言名称与说明。
[settings_schema]
type = "object"
x-pt-order = ["classes", "promote_mode", "protect_days", "warning_days"]

[settings_schema.properties.promote_mode]
type = "string"
title = "升级方式"
enum = ["highest", "one_step"]
x-pt-enum-titles = ["直接升到满足条件的最高等级", "每次只升一级"]
default = "highest"

[settings_schema.properties.protect_days]
type = "integer"
title = "升级保护期（天）"
description = "升级后这段时间内不做保级检查"
minimum = 0
maximum = 365
default = 7

[settings_schema.properties.warning_days]
type = "integer"
title = "保级警告期（天）"
description = "不满足保级条件时先警告，期满仍不满足才降级"
minimum = 1
maximum = 90
default = 7

[settings_schema.properties.classes]
type = "array"
title = "等级"
description = "从低到高排列。普通等级按条件自动升降；VIP / 荣誉 / 管理组只能由管理员手动设置。删除一个等级后，处于该等级的用户回到默认等级再重新评估。"

[settings_schema.properties.classes.items]
type = "object"
required = ["key", "type"]
additionalProperties = false
x-pt-order = ["key", "name", "abbr", "description", "type", "is_default", "promote", "keep", "can_invite", "protected", "color"]

[settings_schema.properties.classes.items.properties.key]
type = "string"
title = "标识"
description = "唯一，小写字母、数字、下划线，如 power_user；改名等于删除旧等级并新建"
pattern = "^[a-z][a-z0-9_]{0,31}$"

[settings_schema.properties.classes.items.properties.name]
type = "string"
title = "名称"
description = "留空使用内置名称（随界面语言变化）"
maxLength = 32

[settings_schema.properties.classes.items.properties.abbr]
type = "string"
title = "简写"
description = "显示在等级名称后，如 PU、EU；留空使用常用简写（预设等级中高级用户 PU、精英用户 EU 等）"
maxLength = 8

[settings_schema.properties.classes.items.properties.description]
type = "string"
title = "说明"
description = "留空使用内置说明；显示在等级说明页"
maxLength = 1000
x-pt-widget = "textarea"

[settings_schema.properties.classes.items.properties.type]
type = "string"
title = "类型"
enum = ["normal", "vip", "honor", "staff"]
x-pt-enum-titles = ["普通（按条件自动升降）", "VIP（手动）", "荣誉（手动）", "管理组（手动）"]
default = "normal"

[settings_schema.properties.classes.items.properties.is_default]
type = "boolean"
title = "新用户的初始等级"
description = "只能有一个，且必须是普通等级"
default = false

[settings_schema.properties.classes.items.properties.promote]
type = "array"
title = "升级条件"
description = "全部满足时升到该等级；为空则不会自动升到该等级"

[settings_schema.properties.classes.items.properties.promote.items]
type = "object"
required = ["metric", "op", "value"]
additionalProperties = false
x-pt-order = ["metric", "op", "value"]

[settings_schema.properties.classes.items.properties.promote.items.properties.metric]
type = "string"
title = "指标"
enum = ["account_age_days", "uploaded_gib", "downloaded_gib", "ratio", "seed_hours", "avg_seed_hours", "seeding_size_gib", "uploads_count", "seed_points"]
x-pt-enum-titles = ["注册天数", "上传量（GiB）", "下载量（GiB）", "分享率", "做种时长（小时）", "平均每个完成种子的做种时长（小时）", "当前做种体积（GiB）", "发布数（已通过）", "做种积分"]

[settings_schema.properties.classes.items.properties.promote.items.properties.op]
type = "string"
title = "比较"
enum = ["gte", "gt", "lte", "lt"]
x-pt-enum-titles = ["≥", ">", "≤", "<"]

[settings_schema.properties.classes.items.properties.promote.items.properties.value]
type = "number"
title = "数值"
minimum = 0

[settings_schema.properties.classes.items.properties.keep]
type = "array"
title = "保级条件"
description = "不满足时进入警告期，期满降级；为空则不会因条件降级"

[settings_schema.properties.classes.items.properties.keep.items]
type = "object"
required = ["metric", "op", "value"]
additionalProperties = false
x-pt-order = ["metric", "op", "value"]

[settings_schema.properties.classes.items.properties.keep.items.properties.metric]
type = "string"
title = "指标"
enum = ["account_age_days", "uploaded_gib", "downloaded_gib", "ratio", "seed_hours", "avg_seed_hours", "seeding_size_gib", "uploads_count", "seed_points"]
x-pt-enum-titles = ["注册天数", "上传量（GiB）", "下载量（GiB）", "分享率", "做种时长（小时）", "平均每个完成种子的做种时长（小时）", "当前做种体积（GiB）", "发布数（已通过）", "做种积分"]

[settings_schema.properties.classes.items.properties.keep.items.properties.op]
type = "string"
title = "比较"
enum = ["gte", "gt", "lte", "lt"]
x-pt-enum-titles = ["≥", ">", "≤", "<"]

[settings_schema.properties.classes.items.properties.keep.items.properties.value]
type = "number"
title = "数值"
minimum = 0

[settings_schema.properties.classes.items.properties.can_invite]
type = "boolean"
title = "可以发邀请"
default = true

[settings_schema.properties.classes.items.properties.protected]
type = "boolean"
title = "不降级"
description = "达到后不再做保级检查"
default = false

[settings_schema.properties.classes.items.properties.color]
type = "string"
title = "颜色"
description = "用户名与等级标签的颜色，如 #e53935；留空为默认"
pattern = "^(#[0-9a-fA-F]{6})?$"

