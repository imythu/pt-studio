[package]
name = "pt-wasm-levels"
description = "PT Studio levels plugin (WASM): user classes, promotion/demotion, protection"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pt-plugin-sdk = { path = "../../../crates/plugin-sdk-rust" }
# 解析本插件清单中的预设等级（settings_schema 的 classes 默认值），预设只维护一份
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
