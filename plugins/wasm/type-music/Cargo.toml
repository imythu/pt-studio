[package]
name = "pt-wasm-type-music"
description = "PT Studio Music content type (WASM): artists, editions, format/encoding rules, file checks, rip log scoring"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.62"
pt-type-kit = { path = "../../../crates/type-kit" }
