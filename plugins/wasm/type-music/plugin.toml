id = "type-music"
name = "资源类型：音乐"
version = "0.1.0"
kind = "wasm"
api = "pt:plugin@0.1"
license = "MIT OR Apache-2.0"
authors = ["PT Studio"]
description = "音乐：艺人与专辑分组、版本（介质 / 年份 / 厂牌 / 目录号）、格式与编码规则、文件检查、抓轨日志评分、搜索字段"

requires = ["ctx.torrents@^0.1"]

[capabilities]
sql = true
content_type = true
search_contributor = true
views = ["torrent.v_torrent_fields"]

[capabilities.scopes]
"ctx.torrents" = ["write:fields"]

[[hooks]]
hook = "torrent.before_upload"
priority = 22

[[http.routes]]
id = "log_check"
method = "POST"
path = "/v1/log-check"
auth = "user"
rate_limit = "user:30/m"
max_body_kb = 600

[[subscriptions]]
name = "on_torrent_created"
event = "torrent.created"

[[subscriptions]]
name = "on_torrent_updated"
event = "torrent.updated"

[[jobs]]
name = "check_logs"
timeout_secs = 60

[database]
migrations = "migrations"

[settings_schema]
type = "object"

[settings_schema.properties.title_template]
type = "string"
maxLength = 300
title = "规范标题模板"
default = "{artist_credit} - {album} {original_year?[|]} {edition_title?(|)} [{media} {format} {encoding}{log? |}]"

[settings_schema.properties.log_check_enabled]
type = "boolean"
title = "上传后检查抓轨日志"
default = true

