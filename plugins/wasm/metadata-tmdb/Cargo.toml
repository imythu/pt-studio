[package]
name = "pt-wasm-metadata-tmdb"
description = "PT Studio TMDB metadata source (WASM): lookup, search, normalization, cache and image re-hosting"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.62"
sha2 = { version = "0.10", default-features = false }
