[package]
name = "pt-wasm-promotion"
description = "PT Studio promotion plugin (WASM): freeleech / 2x promotions, auto rules, site events, personal cards"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.62"
