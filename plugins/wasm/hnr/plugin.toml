id = "hnr"
name = "H&R 考核"
version = "0.1.0"
kind = "wasm"
api = "pt:plugin@1"
license = "MIT OR Apache-2.0"
authors = ["PT Studio"]
description = "下载完成后的做种考核：豁免规则、分层评估、超限限制下载、免除"

provides = ["ctx.hnr@0.1.0"]
requires = ["ctx.users@^0.1", "ctx.rbac@^0.1"]
optional_requires = ["ctx.promotions@^0.1"]
publishes = ["hnr.recorded", "hnr.exempted", "hnr.prewarned", "hnr.satisfied", "hnr.failed", "hnr.forgiven"]

[capabilities]
sql = true
views = ["accounting.v_snatch", "torrent.v_torrent_public", "identity.v_user_public"]

[capabilities.scopes]
"ctx.users" = ["write:status"]

[[subscriptions]]
name = "on_snatch_completed"
event = "traffic.snatch_completed"
ordered = true

[[subscriptions]]
name = "on_torrent_deleted"
event = "torrent.deleted"

[[subscriptions]]
name = "on_torrent_status"
event = "torrent.status_changed"

[[hooks]]
hook = "torrent.before_download"
priority = 40

[[hooks]]
hook = "invite.before_issue"
priority = 40

[[cron]]
name = "evaluate_hot"
schedule = "*/10 * * * *"
timeout_secs = 540
tx = "manual"

[[cron]]
name = "evaluate_cold"
schedule = "20 * * * *"
timeout_secs = 1800
tx = "manual"

[[cron]]
name = "expire_counts"
schedule = "50 3 * * *"
timeout_secs = 1800
tx = "manual"

[[mcp.tools]]
name = "list_my_hnr"
title = "我的 H&R"
description = "查询当前用户的 H&R（下载后未达做种要求）记录与限制状态；state 可选 open / pending / failed / forgiven / passed 筛选。"
input_schema = { type = "object", additionalProperties = false, properties = { state = { type = "string", maxLength = 16 } } }

[[http.routes]]
id = "me"
method = "GET"
path = "/v1/me"
auth = "user"
rate_limit = "user:120/m"

[[http.routes]]
id = "my_records"
method = "GET"
path = "/v1/me/records"
auth = "user"
rate_limit = "user:60/m"

[[http.routes]]
id = "user_records"
method = "GET"
path = "/v1/users/{id}/records"
auth = "user"
permission = "hnr.read"
rate_limit = "user:60/m"

[[http.routes]]
id = "forgive"
method = "POST"
path = "/v1/records/{id}/forgive"
auth = "admin"
permission = "hnr.forgive"
rate_limit = "user:60/m"

[[http.routes]]
id = "requirement"
method = "GET"
path = "/v1/torrents/{id}/requirement"
auth = "user"
rate_limit = "user:120/m"

[[permissions]]
name = "hnr.read"
description_term = "hnr.perm.read"
default_roles = ["moderator"]

[[permissions]]
name = "hnr.forgive"
description_term = "hnr.perm.forgive"
default_roles = ["moderator"]

[[permissions]]
name = "hnr.manage"
description_term = "hnr.perm.manage"
default_roles = ["admin"]

[database]
migrations = "migrations"

[[database.partitions]]
table = "records"
by = "range_month"
premake = 3

[frontend]
entry = "index.js"
slots = ["user.profile.stats", "torrent.detail.header"]
routes = []
settings_ui = "schema"

[settings_schema]
type = "object"
additionalProperties = true

[settings_schema.properties.window_days]
type = "integer"
minimum = 1
maximum = 60
default = 14
title = "考核期（天）"

[settings_schema.properties.min_seed_hours]
type = "integer"
minimum = 0
maximum = 720
default = 72
title = "最低做种时长（小时）"

[settings_schema.properties.min_torrent_ratio]
type = "number"
minimum = 0
default = 1.0
title = "单种分享率（0 = 不使用）"

[settings_schema.properties.max_hnr]
type = "integer"
minimum = 1
maximum = 1000
default = 5
title = "计入上限（达到后限制下载）"

[settings_schema.properties.invite_block_at]
type = "integer"
minimum = 0
default = 1
title = "计入达到该数时禁止发邀（0 = 不限制）"

[settings_schema.properties.expire_days]
type = "integer"
minimum = 1
maximum = 365
default = 90
title = "计入有效期（天）"

[settings_schema.properties.redownload_mode]
type = "string"
enum = ["ignore", "new_record"]
default = "ignore"
title = "重新下载已计入的种子"

[terms]
"hnr.name" = { zh-CN = "H&R", en = "H&R" }
"hnr.active" = { zh-CN = "考核中", en = "In progress" }
"hnr.failed" = { zh-CN = "已计入", en = "Counted" }
"hnr.perm.read" = { zh-CN = "查看他人 H&R", en = "View H&R records" }
"hnr.perm.forgive" = { zh-CN = "免除 H&R", en = "Forgive H&R" }
"hnr.perm.manage" = { zh-CN = "管理 H&R 规则", en = "Manage H&R rules" }
