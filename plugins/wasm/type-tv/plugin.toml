id = "type-tv"
name = "资源类型：剧集"
version = "0.1.0"
kind = "wasm"
api = "pt:plugin@0.1"
license = "MIT OR Apache-2.0"
authors = ["PT Studio"]
description = "剧集：从发布名推断季集与范围、按季分组、上传时按文件列表检查范围、剧与季元数据补全、搜索字段"

requires = ["ctx.torrents@^0.1"]
optional_requires = ["ctx.metadata@^0.1"]

[capabilities]
sql = true
content_type = true
search_contributor = true
views = ["torrent.v_torrent_fields"]

[capabilities.scopes]
"ctx.torrents" = ["write:group"]

[[hooks]]
hook = "torrent.before_upload"
priority = 20

[[subscriptions]]
name = "on_group_created"
event = "group.created"

[[jobs]]
name = "fetch_metadata"
timeout_secs = 60

[settings_schema]
type = "object"

[settings_schema.properties.title_template]
type = "string"
maxLength = 300
title = "规范标题模板"
default = "{title} {se} {resolution} {release_type?| }{source} {hdr?| }{video_codec} {audio_codecs?| }-{release_group}"

[settings_schema.properties.metadata_locale]
type = "string"
maxLength = 16
title = "元数据语言"
default = "zh-CN"

[settings_schema.properties.scope_check]
type = "boolean"
title = "上传时按文件列表检查范围"
default = true

[settings_schema.properties.season_pack_min_ratio]
type = "number"
minimum = 0
maximum = 1
title = "季包最少集数比例（完结季）"
default = 0.8

[terms]
"type-tv.name" = { zh-CN = "剧集", en = "TV" }
"type-tv.field.title" = { zh-CN = "剧名", en = "Title" }
"type-tv.field.title_zh" = { zh-CN = "中文名", en = "Chinese title" }
"type-tv.field.original_title" = { zh-CN = "原名", en = "Original title" }
"type-tv.field.first_air_year" = { zh-CN = "首播年份", en = "First aired" }
"type-tv.field.tmdb_tv_id" = { zh-CN = "TMDB", en = "TMDB" }
"type-tv.field.imdb_id" = { zh-CN = "IMDb", en = "IMDb" }
"type-tv.field.douban_id" = { zh-CN = "豆瓣", en = "Douban" }
