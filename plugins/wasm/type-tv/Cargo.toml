[package]
name = "pt-wasm-type-tv"
description = "PT Studio TV content type (WASM): season/episode inference, season-level grouping, file-list scope checks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pt-plugin-sdk = { path = "../../../crates/plugin-sdk-rust" }
pt-release-parser = { path = "../../../crates/release-parser" }
pt-type-kit = { path = "../../../crates/type-kit" }
