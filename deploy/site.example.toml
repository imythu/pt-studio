# PT Studio 站点配置示例。复制为 site.toml 后修改；带 @SECRET 的值必须替换为随机值（deploy/dev/run-site.sh 会自动生成）。
# 字段说明见 docs/platform/kernel/03-详细设计说明书.md §13。

[site]
name = "PT Studio"
base_url = "http://localhost:31251"     # 对外地址（链接、Cookie、CSRF 来源检查都以它为准）
timezone = "Asia/Shanghai"
default_locale = "zh-CN"
locales = ["zh-CN", "en"]

[kernel]
mode = "dev"                           # dev：允许未签名插件包、出站 HTTP 可用 http；生产用 "prod"

[http]
bind = "0.0.0.0:31251"
web_dir = "web/dist"                   # 前端构建目录（cd web && npm run build）

[database]
# 网关角色（运行期）与管理角色（迁移）；先以超级用户执行 deploy/postgres/bootstrap.sql
url = "postgres://pt_gateway:change-me-gateway@127.0.0.1:5432/pt"
admin_url = "postgres://pt_admin:change-me-admin@127.0.0.1:5432/pt"
pool_size = 20
migrate_on_start = true

[redis.main]
url = "redis://127.0.0.1:6379/0"

[blob]
dir = "data/blob"                      # 种子文件等对象存储（本地目录）

[plugins]
dir = "dist/plugins"                   # WASM 插件包目录（pt-server plugin package 的输出）
allow_unsigned = true                  # 插件包签名尚未实现，必须为 true

# 敏感数据授权：identity 需要邮箱与 IP；notify 的邮件渠道需要邮箱
[grants.identity]
sensitive = ["user.ip", "user.email"]

[grants.notify]
sensitive = ["user.email"]

[plugin.identity]
# insecure_cookies = true                # 仅限 HTTP 测试部署：会话 cookie 去掉 __Host- 前缀与 Secure（浏览器不接受 HTTP 页面上的 Secure cookie）；正式部署用 HTTPS，不要开启
secret_key = "@SECRET_HEX_32"          # 32 字节十六进制（64 个字符）：邮箱加密、passkey、HMAC 的根密钥，设定后不要更换

[plugin.invite]
secret = "@SECRET_BASE64_32"           # 32 字节 base64：邀请码派生

[plugin.torrent]
announce_base_urls = ["http://localhost:31252/announce"]   # tracker 地址（种子中写入 <地址>/<passkey>）
types = ["movie", "tv", "anime", "music", "generic"]

[plugin.search-meilisearch]
instances = [{ id = "m1", url = "http://127.0.0.1:7700", api_key = "@MEILI_MASTER_KEY" }]

# 可选：Claude（AI 上传预审、内容审核、站内助手）
# [plugin.llm-claude]
# api_key = "sk-ant-..."

# 可选：TMDB 元数据（电影、剧集自动补全）
# [plugin.metadata-tmdb]
# api_key = "..."

# 可选：邮件通知（http_relay / postmark / sendgrid）
