# docker compose -f deploy/docker/compose.yaml up --build
# 打开 http://localhost:8080 注册后授予管理员：
#   docker compose -f deploy/docker/compose.yaml exec server pt-server --config /data/site.toml user grant-role <用户名> admin
# 正式部署前修改下面的密码与 key，并把 PT_BASE_URL / PT_TRACKER_URL 改为对外地址。
name: pt-studio

x-env: &env
  PT_DB_ADMIN_PASSWORD: change-me-admin
  PT_DB_GATEWAY_PASSWORD: change-me-gateway
  PT_MEILI_KEY: change-me-meili-master-key-0123456789

services:
  postgres:
    image: postgres:17
    environment:
      <<: *env
      POSTGRES_PASSWORD: change-me-postgres
    volumes:
      - pg:/var/lib/postgresql/data
      - ./initdb.sh:/docker-entrypoint-initdb.d/10-pt.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_MASTER_KEY: change-me-meili-master-key-0123456789
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili:/meili_data

  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: pt-studio
    command: ["server"]
    environment:
      <<: *env
      PT_BASE_URL: http://localhost:8080
      PT_TRACKER_URL: http://localhost:8081
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  tracker:
    image: pt-studio
    command: ["tracker"]
    ports:
      - "8081:8081"
    depends_on:
      - server

volumes:
  pg:
  redis:
  meili:
  data:
