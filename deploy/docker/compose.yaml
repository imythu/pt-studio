# PT Studio：docker compose 一键部署（站点 + tracker + PostgreSQL + Redis + Meilisearch）。
# 只需要本文件和同目录的 .env（模板：deploy/docker/.env.example），详见 deploy/docker/README.md：
#   mkdir pt-studio && cd pt-studio
#   curl -fsSLO https://raw.githubusercontent.com/imythu/pt-studio/main/deploy/docker/compose.yaml
#   curl -fsSL https://raw.githubusercontent.com/imythu/pt-studio/main/deploy/docker/.env.example -o .env
#   docker compose up -d
#
# 需要 Docker Compose ≥ 2.23（数据库初始化脚本内嵌在下方 configs 中）。
# 全部数据在本目录的 ./data/ 下（postgres、redis、meilisearch、pt：站点配置 site.toml 与种子文件）。
# 没有 .env 时用下面的默认值，只适合本机试用。
# 镜像由 GitHub Actions 构建：ghcr.io/imythu/pt-studio（latest 为最新版本，main 为主分支最新提交；可用 PT_IMAGE 指定）。
name: pt-studio

x-env: &env
  PT_DB_ADMIN_PASSWORD: ${PT_DB_ADMIN_PASSWORD:-change-me-admin}
  PT_DB_GATEWAY_PASSWORD: ${PT_DB_GATEWAY_PASSWORD:-change-me-gateway}
  PT_MEILI_KEY: ${PT_MEILI_KEY:-change-me-meili-master-key-0123456789}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      <<: *env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    configs:
      - source: initdb
        target: /docker-entrypoint-initdb.d/10-pt.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data

  meilisearch:
    image: getmeili/meilisearch:v1.54
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${PT_MEILI_KEY:-change-me-meili-master-key-0123456789}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./data/meilisearch:/meili_data

  server:
    image: ${PT_IMAGE:-ghcr.io/imythu/pt-studio:latest}
    # 从源码构建时改用（在仓库的 deploy/docker 目录中执行 docker compose up -d --build）：
    # build:
    #   context: ../..
    #   dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    command: ["server"]
    environment:
      <<: *env
      # 首次启动时写入 ./data/pt/site.toml；之后修改地址需编辑 site.toml
      PT_BASE_URL: ${PT_BASE_URL:-http://localhost:31251}
      PT_TRACKER_URL: ${PT_TRACKER_URL:-http://localhost:31252}
      # 仅 HTTP 测试部署：会话 cookie 不带 Secure（正式使用请上 HTTPS）
      PT_INSECURE_COOKIES: ${PT_INSECURE_COOKIES:-false}
    ports:
      - "${PT_HTTP_PORT:-31251}:31251"
    volumes:
      - ./data/pt:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  tracker:
    image: ${PT_IMAGE:-ghcr.io/imythu/pt-studio:latest}
    restart: unless-stopped
    command: ["tracker"]
    environment:
      # 在反向代理之后时设为 true（从 X-Forwarded-For 取客户端 IP）
      PT_TRUST_FORWARDED: ${PT_TRUST_FORWARDED:-false}
    ports:
      - "${PT_TRACKER_PORT:-31252}:31252"
    depends_on:
      - server

configs:
  # PostgreSQL 首次初始化（数据目录为空时执行一次），等价于 deploy/postgres/bootstrap.sql。
  # 由官方镜像的入口脚本 source 执行，失败时 psql 返回非零、初始化中止；密码由 compose 从 .env 代入。
  initdb:
    content: |
      psql -v ON_ERROR_STOP=1 --username postgres --dbname postgres <<'SQL'
      CREATE ROLE pt_admin LOGIN CREATEROLE PASSWORD '${PT_DB_ADMIN_PASSWORD:-change-me-admin}';
      CREATE ROLE pt_gateway LOGIN NOINHERIT PASSWORD '${PT_DB_GATEWAY_PASSWORD:-change-me-gateway}';
      GRANT pt_gateway TO pt_admin WITH INHERIT FALSE, SET TRUE;
      CREATE DATABASE pt OWNER pt_admin;
      SQL
      psql -v ON_ERROR_STOP=1 --username postgres --dbname pt <<'SQL'
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      REVOKE EXECUTE ON FUNCTION pg_catalog.set_config(text, text, boolean) FROM PUBLIC;
      GRANT  EXECUTE ON FUNCTION pg_catalog.set_config(text, text, boolean) TO pt_gateway, pt_admin;
      REVOKE USAGE ON LANGUAGE plpgsql FROM PUBLIC;
      GRANT  USAGE ON LANGUAGE plpgsql TO pt_gateway, pt_admin WITH GRANT OPTION;
      SQL
