# docker compose -f deploy/docker/compose.yaml up -d
# 镜像由 GitHub Actions 构建并发布到 ghcr.io/imythu/pt-studio（latest 为最新的版本标签，main 为主分支最新提交）；
# 要从源码构建，取消下面 server 中 build 一节的注释并加 --build。
# 打开 http://localhost:31251 注册后授予管理员：
#   docker compose -f deploy/docker/compose.yaml exec server pt-server --config /data/site.toml user grant-role <用户名> admin
# 正式部署前修改下面的密码与 key，并把 PT_BASE_URL / PT_TRACKER_URL 改为对外地址。
name: pt-studio

x-env: &env
  PT_DB_ADMIN_PASSWORD: change-me-admin
  PT_DB_GATEWAY_PASSWORD: change-me-gateway
  PT_MEILI_KEY: change-me-meili-master-key-0123456789

services:
  postgres:
    image: postgres:17
    environment:
      <<: *env
      POSTGRES_PASSWORD: change-me-postgres
    volumes:
      - pg:/var/lib/postgresql/data
      - ./initdb.sh:/docker-entrypoint-initdb.d/10-pt.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_MASTER_KEY: change-me-meili-master-key-0123456789
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili:/meili_data

  server:
    image: ghcr.io/imythu/pt-studio:latest
    # build:
    #   context: ../..
    #   dockerfile: deploy/docker/Dockerfile
    command: ["server"]
    environment:
      <<: *env
      PT_BASE_URL: http://localhost:31251
      PT_TRACKER_URL: http://localhost:31252
    ports:
      - "31251:31251"
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started

  tracker:
    image: ghcr.io/imythu/pt-studio:latest
    command: ["tracker"]
    ports:
      - "31252:31252"
    depends_on:
      - server

volumes:
  pg:
  redis:
  meili:
  data:
