[workspace]
resolver = "3"
members = ["crates/plugin-api", "crates/kernel", "crates/markup", "crates/release-parser", "crates/server", "crates/type-kit", "plugins/native/*"]
exclude = ["crates/pt-tracker", "crates/plugin-sdk-rust", ".spike", "plugins/wasm", "templates"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
publish = false

[workspace.dependencies]
pt-plugin-api = { path = "crates/plugin-api" }
pt-kernel = { path = "crates/kernel" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http = "1"
redis = { version = "1", features = ["tokio-comp", "connection-manager", "streams"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "chrono", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
